<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#cyberNeon)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Matrix Background Grid -->
  <g stroke="url(#gridGlow)" stroke-width="2">
    <line x1="64" y1="64" x2="64" y2="448"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="192" y1="64" x2="192" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="320" y1="64" x2="320" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="448" y1="64" x2="448" y2="448"/>

    <line x1="64" y1="64" x2="448" y2="64"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="64" y1="448" x2="448" y2="448"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="128" cy="128" r="5" fill="#00f0ff" opacity="0.8"/>
  <circle cx="384" cy="128" r="5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="256" cy="256" r="6" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="128" cy="384" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="384" cy="384" r="5" fill="#00f0ff" opacity="0.8"/>

  <!-- Matrix 'M' Monogram Vector -->
  <path d="M 120 376 L 120 156 L 256 280 L 392 156 L 392 376" 
        fill="none" 
        stroke="url(#cyberNeon)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- Inner High-Contrast Core -->
  <path d="M 120 376 L 120 156 L 256 280 L 392 156 L 392 376" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
