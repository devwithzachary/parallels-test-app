[package]
name = "matrix-app"
version = "0.1.0"
description = "Matrix App - Cross-platform demonstration application"
authors = ["Matrix App Team"]
edition = "2021"

[lib]
name = "matrix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
debug = 1

[profile.release]
strip = true
lto = true
opt-level = "z"

